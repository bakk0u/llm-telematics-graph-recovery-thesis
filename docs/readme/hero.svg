<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="395" viewBox="0 0 1000 395" role="img" aria-labelledby="title"><title id="title">LLM Graph Recovery — Propose the structure. Benchmark every edge.</title><defs><linearGradient id="spectrum"><stop stop-color="#438cff"/><stop offset=".6" stop-color="#ff69c8"/><stop offset="1" stop-color="#ffe46b"/></linearGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif}.orbit{animation:orbit 20s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.draw{stroke-dasharray:500;animation:draw 8s ease-in-out infinite}.flow{stroke-dasharray:5 13;animation:flow 6s linear infinite}.slide{animation:slide 8s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}@keyframes draw{0%{stroke-dashoffset:500}70%,100%{stroke-dashoffset:0}}@keyframes flow{to{stroke-dashoffset:-144}}@keyframes slide{0%,15%,100%{transform:translateX(0)}50%,70%{transform:translateX(64px)}}@media(prefers-reduced-motion:reduce){.orbit,.pulse,.draw,.flow,.slide{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}</style><rect x="1" y="1" width="998" height="393" rx="22" fill="#070b18" stroke="#26374f"/><text x="38" y="38" font-size="11" fill="#91b5ff" font-weight="700">BACHELOR THESIS / PROMPT DECOMPOSITION</text><text x="38" y="100" font-size="55" fill="#eff5ff" font-weight="700">LLM Graph</text><text x="38" y="163" font-size="55" fill="#eff5ff" font-weight="700">Recovery</text><text x="38" y="212" font-size="24" fill="#91b5ff" font-weight="400">Propose the structure.</text><text x="38" y="243" font-size="24" fill="#91b5ff" font-weight="400">Benchmark every edge.</text><g transform="translate(650 55) scale(1)"><path d="M150 112L261.0 112.0" fill="none" stroke="#91b5ff" stroke-width="1.5" class="flow"/><path d="M261.0 112.0L205.5 186.48" fill="none" stroke="#26374f" stroke-width="1" class=""/><circle cx="261.0" cy="112.0" r="17" fill="#070b18" stroke=